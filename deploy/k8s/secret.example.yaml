apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: platform
  labels:
    app.kubernetes.io/name: platform
type: Opaque
stringData:
  # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  SECRET_ENCRYPTION_KEY: REPLACE_ME
  MODEL_GATEWAY_API_KEY: REPLACE_ME
  # Required for multi-replica API + workers.
  DATABASE_URL: postgresql+asyncpg://USER:PASS@postgres:5432/platform
  # Required when exposing /internal/* on a private network.
  # INTERNAL_SIGNING_SECRET: REPLACE_ME
