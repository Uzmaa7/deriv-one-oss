apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
  namespace: platform
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: REGISTRY/platform-backend:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  # Name must be "backend" — the frontend nginx image proxies to backend:8000.
  name: backend
  namespace: platform
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
