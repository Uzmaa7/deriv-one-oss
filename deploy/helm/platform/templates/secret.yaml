{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.secretName" . }}
  namespace: {{ include "platform.namespace" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret }}
{{- if and (ne $key "create") (ne $key "existingSecret") }}
{{- if $value }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
